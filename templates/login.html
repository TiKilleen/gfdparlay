{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}

<h1>Log in</h1>
{% if error %}<p class="loss">{{ error }}</p>{% endif %}
<form class="stacked" method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
  <label>Password</label>
  <input type="password" name="password" autofocus required>
  <button type="submit">Log in</button>
</form>

{% endblock %}
